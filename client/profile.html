<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Profile - ShopNest</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/toast.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="/index.html" class="navbar-brand">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        Shop<span>Nest</span>
      </a>

      <nav>
        <ul class="navbar-nav" id="navbarNav">
          <li><a href="/index.html" class="nav-link">Home</a></li>
          <li><a href="/shop.html" class="nav-link">Shop</a></li>
          <li><a href="/orders.html" class="nav-link">My Orders</a></li>
        </ul>
      </nav>

      <div class="navbar-actions">
        <a href="/cart.html" class="cart-icon-btn" title="Shopping Cart">
          🛒
          <span class="cart-badge" id="cart-badge">0</span>
        </a>
        <div id="user-menu-container"></div>
        <button class="mobile-toggle" id="mobileNavToggle">☰</button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container" style="max-width: 680px;">
      <div class="section-header" style="margin-bottom: 2rem;">
        <h1 class="section-title">Customer Account Profile</h1>
        <p class="section-subtitle">Manage your personal details, phone number, delivery address, and security password</p>
      </div>

      <div style="background-color: var(--white); border-radius: var(--radius-lg); border: 1px solid var(--gray-200); box-shadow: var(--shadow-sm); padding: 2rem;">
        <form id="profile-form">
          <div class="form-group">
            <label class="form-label" for="profile-name">Full Name *</label>
            <input type="text" id="profile-name" class="form-control" required>
          </div>

          <div class="form-group">
            <label class="form-label" for="profile-email">Email Address</label>
            <input type="email" id="profile-email" class="form-control" readonly style="background-color: var(--gray-100); color: var(--gray-500);">
            <small style="color: var(--gray-500); font-size: 0.75rem;">Email address cannot be modified.</small>
          </div>

          <div class="form-group">
            <label class="form-label" for="profile-phone">Phone Number</label>
            <input type="tel" id="profile-phone" class="form-control" placeholder="+1 555-0144">
          </div>

          <div class="form-group">
            <label class="form-label" for="profile-address">Default Delivery Address</label>
            <textarea id="profile-address" class="form-control" rows="3" placeholder="Enter your default shipping address"></textarea>
          </div>

          <h3 style="font-size: 1.15rem; margin: 2rem 0 1rem; border-top: 1px solid var(--gray-200); padding-top: 1.25rem;">
            🔒 Security Password Change
          </h3>

          <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;">
            <div class="form-group">
              <label class="form-label" for="profile-current-password">Current Password</label>
              <input type="password" id="profile-current-password" class="form-control" placeholder="••••••••">
            </div>
            <div class="form-group">
              <label class="form-label" for="profile-new-password">New Password</label>
              <input type="password" id="profile-new-password" class="form-control" placeholder="Min 6 characters">
            </div>
          </div>

          <button type="submit" class="btn btn-primary btn-lg" style="margin-top: 1.5rem;">
            Save Profile Changes
          </button>
        </form>
      </div>
    </div>
  </main>

  <footer>
    <div class="container text-center">
      &copy; 2026 ShopNest E-Commerce Platform.
    </div>
  </footer>

  <script src="/js/config.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
