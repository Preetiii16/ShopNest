<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customer Login - ShopNest</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/toast.css">
</head>
<body style="background-color: var(--gray-100);">

  <header class="navbar">
    <div class="container navbar-container">
      <a href="/index.html" class="navbar-brand">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        Shop<span>Nest</span>
      </a>
      <div id="user-menu-container"></div>
    </div>
  </header>

  <main class="section" style="display: flex; align-items: center; justify-content: center; min-height: calc(100vh - 160px);">
    <div style="width: 100%; max-width: 440px; background-color: var(--white); border-radius: var(--radius-xl); padding: 2.5rem; border: 1px solid var(--gray-200); box-shadow: var(--shadow-xl);">
      <div class="text-center" style="margin-bottom: 2rem;">
        <h2 style="font-size: 1.75rem; margin-bottom: 0.5rem;">Welcome Back</h2>
        <p class="text-muted">Sign in to your ShopNest customer account</p>
      </div>

      <form id="login-form">
        <div class="form-group">
          <label class="form-label" for="login-email">Email Address</label>
          <input type="email" id="login-email" class="form-control" placeholder="john@example.com" required autocomplete="email">
        </div>

        <div class="form-group">
          <label class="form-label" for="login-password">Password</label>
          <input type="password" id="login-password" class="form-control" placeholder="••••••••" required autocomplete="current-password">
        </div>

        <button type="submit" id="login-submit-btn" class="btn btn-primary btn-lg btn-block" style="margin-top: 1.5rem;">
          Sign In
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; font-size: 0.9rem; color: var(--gray-600);">
        Don't have an account? <a href="/register.html" style="color: var(--primary-600); font-weight: 700;">Create One Here</a>
      </div>

      <div style="margin-top: 1rem; text-align: center; border-top: 1px solid var(--gray-200); padding-top: 1rem;">
        <a href="/admin-login.html" style="font-size: 0.85rem; color: var(--gray-500);">Administrator Portal &rarr;</a>
      </div>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.isLoggedIn()) {
        window.location.href = Auth.isAdmin() ? '/admin-dashboard.html' : '/index.html';
      }

      document.getElementById('login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;

        const btn = document.getElementById('login-submit-btn');
        btn.disabled = true;
        btn.textContent = 'Signing in...';

        try {
          const data = await apiFetch('/auth/login', {
            method: 'POST',
            body: { email, password }
          });

          if (data.success) {
            showToast(data.message, 'success');
            Auth.setToken(data.token);
            Auth.setUser(data.user);

            setTimeout(() => {
              window.location.href = data.user.role === 'admin' ? '/admin-dashboard.html' : '/index.html';
            }, 800);
          }
        } catch (error) {
          showToast(error.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Sign In';
        }
      });
    });
  </script>
</body>
</html>
