<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Checkout - ShopNest</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/toast.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="/index.html" class="navbar-brand">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        Shop<span>Nest</span>
      </a>

      <nav>
        <ul class="navbar-nav" id="navbarNav">
          <li><a href="/index.html" class="nav-link">Home</a></li>
          <li><a href="/shop.html" class="nav-link">Shop</a></li>
          <li><a href="/orders.html" class="nav-link">My Orders</a></li>
        </ul>
      </nav>

      <div class="navbar-actions">
        <a href="/cart.html" class="cart-icon-btn" title="Shopping Cart">
          🛒
          <span class="cart-badge" id="cart-badge">0</span>
        </a>
        <div id="user-menu-container"></div>
        <button class="mobile-toggle" id="mobileNavToggle">☰</button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-header" style="margin-bottom: 2rem;">
        <h1 class="section-title">Checkout</h1>
        <p class="section-subtitle">Confirm your shipping details and place your order</p>
      </div>

      <div style="display: grid; grid-template-columns: 1fr 380px; gap: 2.5rem; align-items: start;">
        <!-- Shipping & Payment Form -->
        <div style="background-color: var(--white); padding: 2rem; border-radius: var(--radius-lg); border: 1px solid var(--gray-200); box-shadow: var(--shadow-sm);">
          <h3 style="font-size: 1.35rem; margin-bottom: 1.5rem; border-bottom: 1px solid var(--gray-200); padding-bottom: 0.75rem;">
            📍 Shipping & Contact Details
          </h3>

          <form id="checkout-form">
            <div class="form-group">
              <label class="form-label">Full Name</label>
              <input type="text" id="checkout-name" class="form-control" readonly style="background-color: var(--gray-100);">
            </div>

            <div class="form-group">
              <label class="form-label">Email Address</label>
              <input type="email" id="checkout-email" class="form-control" readonly style="background-color: var(--gray-100);">
            </div>

            <div class="form-group">
              <label class="form-label" for="checkout-phone">Contact Phone Number *</label>
              <input type="tel" id="checkout-phone" class="form-control" placeholder="+1 555-0144" required>
            </div>

            <div class="form-group">
              <label class="form-label" for="checkout-address">Delivery Address *</label>
              <textarea id="checkout-address" class="form-control" rows="3" placeholder="Full street address, City, State, Postal Code" required></textarea>
            </div>

            <h3 style="font-size: 1.35rem; margin: 2rem 0 1rem; border-bottom: 1px solid var(--gray-200); padding-bottom: 0.75rem;">
              💳 Payment Method
            </h3>

            <div style="background-color: var(--primary-50); border: 1px solid var(--primary-500); border-radius: var(--radius-md); padding: 1.25rem; display: flex; align-items: center; gap: 1rem;">
              <input type="radio" id="cod" name="payment-method" checked style="width: 20px; height: 20px;">
              <label for="cod" style="font-weight: 700; color: var(--primary-800); cursor: pointer;">
                💵 Cash on Delivery (COD)
                <div style="font-weight: 400; font-size: 0.85rem; color: var(--gray-600); margin-top: 0.2rem;">
                  Pay in cash when your order arrives at your doorstep.
                </div>
              </label>
            </div>

            <button type="submit" id="place-order-btn" class="btn btn-primary btn-lg btn-block" style="margin-top: 2rem;">
              Place Order (Cash on Delivery) &rarr;
            </button>
          </form>
        </div>

        <!-- Order Summary Side Card -->
        <div style="background-color: var(--white); padding: 1.75rem; border-radius: var(--radius-lg); border: 1px solid var(--gray-200); box-shadow: var(--shadow-sm);">
          <h3 style="font-size: 1.25rem; margin-bottom: 1.25rem;">Order Summary</h3>
          <div id="checkout-items-summary">
            <div class="spinner"></div>
          </div>

          <div style="border-top: 2px solid var(--gray-200); margin-top: 1.25rem; padding-top: 1.25rem; display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: 700; font-size: 1.1rem;">Total Payable:</span>
            <span id="checkout-total-amount" style="font-family: var(--font-display); font-size: 1.75rem; font-weight: 800; color: var(--primary-600);">$0.00</span>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container text-center">
      &copy; 2026 ShopNest E-Commerce Platform.
    </div>
  </footer>

  <script src="/js/config.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/checkout.js"></script>
</body>
</html>
