<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop Products - ShopNest</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/cards.css">
  <link rel="stylesheet" href="/css/toast.css">
</head>
<body>

  <!-- Navigation Bar -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="/index.html" class="navbar-brand">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        Shop<span>Nest</span>
      </a>

      <nav>
        <ul class="navbar-nav" id="navbarNav">
          <li><a href="/index.html" class="nav-link">Home</a></li>
          <li><a href="/shop.html" class="nav-link active">Shop</a></li>
          <li><a href="/orders.html" class="nav-link">My Orders</a></li>
        </ul>
      </nav>

      <div class="navbar-actions">
        <a href="/cart.html" class="cart-icon-btn" title="Shopping Cart">
          🛒
          <span class="cart-badge" id="cart-badge">0</span>
        </a>
        <div id="user-menu-container"></div>
        <button class="mobile-toggle" id="mobileNavToggle">☰</button>
      </div>
    </div>
  </header>

  <main class="section">
    <div class="container">
      <div class="section-header" style="margin-bottom: 2.5rem;">
        <h1 class="section-title">Explore All Products</h1>
        <p class="section-subtitle" id="products-count">Loading collection...</p>
      </div>

      <div style="display: grid; grid-template-columns: 260px 1fr; gap: 2rem; align-items: start;">
        <!-- Filters Sidebar -->
        <aside style="background-color: var(--white); padding: 1.5rem; border-radius: var(--radius-lg); border: 1px solid var(--gray-200); box-shadow: var(--shadow-sm);">
          <h3 style="font-size: 1.1rem; margin-bottom: 1.25rem; border-bottom: 1px solid var(--gray-200); padding-bottom: 0.75rem;">
            🔍 Search & Filter
          </h3>

          <!-- Search Keyword -->
          <div class="form-group">
            <label class="form-label">Search Keyword</label>
            <input type="text" id="search-input" class="form-control" placeholder="Search by name...">
          </div>

          <!-- Category Filter -->
          <div class="form-group">
            <label class="form-label">Category</label>
            <select id="category-filter" class="form-select">
              <option value="all">All Categories</option>
            </select>
          </div>

          <!-- Price Range Slider -->
          <div class="form-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.4rem;">
              <label class="form-label" style="margin-bottom:0;">Max Price</label>
              <span id="price-range-val" style="font-weight: 700; color: var(--primary-600);">$500</span>
            </div>
            <input type="range" id="price-range" min="10" max="500" value="500" step="10" style="width: 100%;">
          </div>

          <!-- Sorting -->
          <div class="form-group">
            <label class="form-label">Sort By</label>
            <select id="sort-filter" class="form-select">
              <option value="newest">Newest First</option>
              <option value="price_asc">Price: Low to High</option>
              <option value="price_desc">Price: High to Low</option>
            </select>
          </div>

          <button class="btn btn-secondary btn-block btn-sm" onclick="resetFilters()" style="margin-top: 1rem;">Reset Filters</button>
        </aside>

        <!-- Products Catalog Grid -->
        <div>
          <div class="products-grid" id="shop-products-container">
            <div class="spinner"></div>
          </div>
        </div>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <div class="footer-bottom">
        &copy; 2026 ShopNest E-Commerce Platform.
      </div>
    </div>
  </footer>

  <script src="/js/config.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/shop.js"></script>
</body>
</html>
