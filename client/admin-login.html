<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login - ShopNest Portal</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/toast.css">
</head>
<body style="background-color: var(--dark-900);">

  <main style="display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 2rem;">
    <div style="width: 100%; max-width: 440px; background-color: var(--white); border-radius: var(--radius-xl); padding: 2.5rem; box-shadow: var(--shadow-xl);">
      <div class="text-center" style="margin-bottom: 2rem;">
        <div style="font-family: var(--font-display); font-size: 1.75rem; font-weight: 800; color: var(--primary-600); margin-bottom: 0.5rem;">
          Shop<span>Nest</span> Admin
        </div>
        <p class="text-muted">Administrator Management Portal</p>
      </div>

      <form id="admin-login-form">
        <div class="form-group">
          <label class="form-label" for="admin-email">Admin Email</label>
          <input type="email" id="admin-email" class="form-control" placeholder="admin@shopnest.com" required value="admin@shopnest.com">
        </div>

        <div class="form-group">
          <label class="form-label" for="admin-password">Password</label>
          <input type="password" id="admin-password" class="form-control" placeholder="••••••••" required value="admin123">
        </div>

        <button type="submit" id="admin-submit-btn" class="btn btn-primary btn-lg btn-block" style="margin-top: 1.5rem;">
          Sign In to Portal &rarr;
        </button>
      </form>

      <div style="margin-top: 1.5rem; text-align: center; border-top: 1px solid var(--gray-200); padding-top: 1rem;">
        <a href="/index.html" style="font-size: 0.85rem; color: var(--gray-500);">&larr; Return to Customer Store</a>
      </div>
    </div>
  </main>

  <script src="/js/config.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      if (Auth.isAdmin()) {
        window.location.href = '/admin-dashboard.html';
      }

      document.getElementById('admin-login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const email = document.getElementById('admin-email').value.trim();
        const password = document.getElementById('admin-password').value;

        const btn = document.getElementById('admin-submit-btn');
        btn.disabled = true;
        btn.textContent = 'Authenticating...';

        try {
          const data = await apiFetch('/auth/login', {
            method: 'POST',
            body: { email, password }
          });

          if (data.success) {
            if (data.user.role !== 'admin') {
              showToast('Access denied. This account does not have administrator privileges.', 'error');
              btn.disabled = false;
              btn.textContent = 'Sign In to Portal \u2192';
              return;
            }

            showToast('Admin login successful!', 'success');
            Auth.setToken(data.token);
            Auth.setUser(data.user);

            setTimeout(() => {
              window.location.href = '/admin-dashboard.html';
            }, 800);
          }
        } catch (error) {
          showToast(error.message, 'error');
          btn.disabled = false;
          btn.textContent = 'Sign In to Portal \u2192';
        }
      });
    });
  </script>
</body>
</html>
