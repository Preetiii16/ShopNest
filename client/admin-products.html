<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Products - ShopNest Admin</title>
  <link rel="stylesheet" href="/css/main.css">
  <link rel="stylesheet" href="/css/navbar.css">
  <link rel="stylesheet" href="/css/admin.css">
  <link rel="stylesheet" href="/css/toast.css">
</head>
<body>

  <!-- Top Navbar -->
  <header class="navbar">
    <div class="container navbar-container">
      <a href="/admin-dashboard.html" class="navbar-brand">
        <svg viewBox="0 0 24 24"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
        Shop<span>Nest</span> <small style="font-size: 0.75rem; background: var(--primary-100); color: var(--primary-700); padding: 0.15rem 0.5rem; border-radius: var(--radius-full);">ADMIN</small>
      </a>

      <div class="navbar-actions">
        <a href="/index.html" class="btn btn-outline btn-sm" target="_blank">🌐 View Storefront</a>
        <div id="user-menu-container"></div>
      </div>
    </div>
  </header>

  <div class="admin-wrapper">
    <!-- Sidebar Navigation -->
    <aside class="admin-sidebar">
      <div class="admin-sidebar-title">Admin Management</div>
      <ul class="admin-nav">
        <li class="admin-nav-item"><a href="/admin-dashboard.html">📊 Dashboard</a></li>
        <li class="admin-nav-item"><a href="/admin-products.html" class="active">🛍️ Products</a></li>
        <li class="admin-nav-item"><a href="/admin-product-form.html">➕ Add Product</a></li>
        <li class="admin-nav-item"><a href="/admin-categories.html">🏷️ Categories</a></li>
        <li class="admin-nav-item"><a href="/admin-users.html">👥 Customers</a></li>
        <li class="admin-nav-item"><a href="/admin-orders.html">📦 Orders</a></li>
      </ul>
    </aside>

    <!-- Main Content -->
    <main class="admin-content">
      <div class="admin-header">
        <div>
          <h2>Product Inventory Management</h2>
          <p class="text-muted">Manage product catalog, prices, image uploads, and stock availability</p>
        </div>
        <a href="/admin-product-form.html" class="btn btn-primary">➕ Add New Product</a>
      </div>

      <div class="table-card">
        <div class="table-card-header">
          <div style="width: 100%; max-width: 320px;">
            <input type="text" id="admin-product-search" class="form-control" placeholder="Search by name or category...">
          </div>
        </div>
        <div class="table-responsive" id="admin-products-table-container">
          <div class="spinner"></div>
        </div>
      </div>
    </main>
  </div>

  <script src="/js/config.js"></script>
  <script src="/js/toast.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/main.js"></script>
  <script src="/js/admin-products.js"></script>
</body>
</html>
